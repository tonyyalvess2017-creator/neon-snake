<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slither.io - Phaser Engine Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { background: #010105; margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { box-shadow: 0 0 100px rgba(0,0,0,0.95); }
    </style>
</head>
<body>

    <script>
        const socket = io("https://neon-snake-xzlj.onrender.com");

        class GameScene extends Phaser.Scene {
            constructor() {
                super('GameScene');
            }

            create() {
                this.cameras.main.setBackgroundColor('#03030b');
                this.worldSize = 5000;

                this.graphics = this.add.graphics();
                this.drawGrid();

                this.myColor = ['#00f0ff', '#ff0055', '#ffe600', '#a855f7'][Math.floor(Math.random() * 4)];
                this.snakeBody = [];
                this.score = 30;

                for (let i = 0; i < 35; i++) {
                    this.snakeBody.push({ x: 2500, y: 2500 + (i * 4) });
                }

                socket.emit('join_game', { x: 2500, y: 2500, body: this.snakeBody, color: this.myColor });
                this.otherPlayers = {};

                socket.on('server_tick', (data) => {
                    this.otherPlayers = data.players;
                });

                this.cameras.main.setBounds(0, 0, this.worldSize, this.worldSize);
            }

            drawGrid() {
                this.graphics.lineStyle(1, 0x0d0d22, 1);
                for (let x = 0; x <= this.worldSize; x += 150) {
                    this.graphics.beginPath();
                    this.graphics.moveTo(x, 0);
                    this.graphics.lineTo(x, this.worldSize);
                    this.graphics.strokePath();
                }
                for (let y = 0; y <= this.worldSize; y += 150) {
                    this.graphics.beginPath();
                    this.graphics.moveTo(0, y);
                    this.graphics.lineTo(this.worldSize, y);
                    this.graphics.strokePath();
                }

                this.graphics.lineStyle(6, 0xff0055, 1);
                this.graphics.strokeRect(0, 0, this.worldSize, this.worldSize);
            }

            update(time, delta) {
                const pointer = this.input.activePointer;
                const cam = this.cameras.main;
                
                const worldMouseX = pointer.x + cam.scrollX;
                const worldMouseY = pointer.y + cam.scrollY;

                let head = this.snakeBody[0];
                let angle = Math.atan2(worldMouseY - head.y, worldMouseX - head.x);
                let speed = 4;

                head.x += Math.cos(angle) * speed;
                head.y += Math.sin(angle) * speed;

                head.x = Phaser.Math.Clamp(head.x, 30, this.worldSize - 30);
                head.y = Phaser.Math.Clamp(head.y, 30, this.worldSize - 30);

                let targetX = head.x;
                let targetY = head.y;
                for (let i = 1; i < this.snakeBody.length; i++) {
                    let part = this.snakeBody[i];
                    let dx = targetX - part.x;
                    let dy = targetY - part.y;
                    let dist = Math.hypot(dx, dy);

                    if (dist > 12) {
                        let a = Math.atan2(dy, dx);
                        part.x = targetX - Math.cos(a) * 12;
                        part.y = targetY - Math.sin(a) * 12;
                    }
                    targetX = part.x;
                    targetY = part.y;
                }

                cam.centerOn(head.x, head.y);

                socket.emit('player_update', {
                    x: head.x,
                    y: head.y,
                    angle: angle,
                    score: this.score,
                    body: this.snakeBody
                });

                this.renderGame(angle);
            }

            renderGame(angle) {
                if (!this.myGraphics) {
                    this.myGraphics = this.add.graphics();
                }
                this.myGraphics.clear();

                // Desenha o corpo do jogador fluido
                for (let i = this.snakeBody.length - 1; i >= 0; i--) {
                    let p = this.snakeBody[i];
                    let radius = Math.max(8, 15 - (i * 0.08));
                    this.myGraphics.fillStyle(Phaser.Display.Color.HexStringToColor(this.myColor).color, 1);
                    this.myGraphics.fillCircle(p.x, p.y, radius);
                }

                // Cabeça
                let head = this.snakeBody[0];
                this.myGraphics.fillStyle(Phaser.Display.Color.HexStringToColor(this.myColor).color, 1);
                this.myGraphics.fillCircle(head.x, head.y, 16);

                // Olhos dinâmicos
                let d = 7;
                let o1x = head.x + Math.cos(angle - 0.55) * d;
                let o1y = head.y + Math.sin(angle - 0.55) * d;
                let o2x = head.x + Math.cos(angle + 0.55) * d;
                let o2y = head.y + Math.sin(angle + 0.55) * d;

                this.myGraphics.fillStyle(0xffffff, 1);
                this.myGraphics.fillCircle(o1x, o1y, 4);
                this.myGraphics.fillCircle(o2x, o2y, 4);

                this.myGraphics.fillStyle(0x010105, 1);
                this.myGraphics.fillCircle(o1x + Math.cos(angle)*1.5, o1y + Math.sin(angle)*1.5, 1.8);
                this.myGraphics.fillCircle(o2x + Math.cos(angle)*1.5, o2y + Math.sin(angle)*1.5, 1.8);

                // Renderiza outros jogadores conectados
                for (let id in this.otherPlayers) {
                    if (id === socket.id) continue;
                    let p = this.otherPlayers[id];
                    if (p && p.body) {
                        for (let part of p.body) {
                            this.myGraphics.fillStyle(Phaser.Display.Color.HexStringToColor(p.color || '#ff0055').color, 1);
                            this.myGraphics.fillCircle(part.x, part.y, 14);
                        }
                    }
                }
            }
        }

        const config = {
            type: Phaser.AUTO,
            width: window.innerWidth,
            height: window.innerHeight,
            physics: { default: 'arcade' },
            scene: [GameScene]
        };

        const game = new Phaser.Game(config);

        window.addEventListener('resize', () => {
            game.scale.resize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

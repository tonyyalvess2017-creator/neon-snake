<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slither.io - Enterprise Engine Pro</title>
    <!-- Usando a mesma rota local do socket.io para evitar conflito de versão com o servidor -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background: #020208; overflow: hidden; font-family: system-ui, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; background: #050510; }
        
        #menu-overlay, #gameover-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(2, 2, 8, 0.95); backdrop-filter: blur(15px);
            display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        #gameover-overlay { display: none; }
        .menu-card {
            background: rgba(10, 10, 25, 0.95); border: 1px solid rgba(255,255,255,0.15);
            padding: 30px; border-radius: 20px; width: 420px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }
        .menu-card h1 { color: #fff; font-size: 24px; margin-bottom: 15px; letter-spacing: 2px; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #aaa; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        .tab-btn.active { background: #00f0ff; color: #020208; border-color: #00f0ff; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .menu-input {
            width: 100%; padding: 12px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px; color: #fff; font-size: 15px; margin-bottom: 15px; outline: none; text-align: center;
        }
        
        .skin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-height: 220px; overflow-y: auto; margin-bottom: 15px; padding-right: 5px; }
        .skin-item {
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
            padding: 10px; cursor: pointer; text-align: center; transition: 0.2s; position: relative;
        }
        .skin-item:hover { border-color: #00f0ff; transform: scale(1.03); }
        .skin-item.selected { border-color: #00f0ff; box-shadow: 0 0 12px #00f0ff; }
        .skin-preview { width: 30px; height: 30px; border-radius: 50%; margin: 0 auto 6px auto; }
        .skin-name { font-size: 11px; color: #fff; }
        .skin-price { font-size: 10px; color: #ffe600; margin-top: 3px; }

        .coin-display {
            background: rgba(255, 230, 0, 0.1); border: 1px solid rgba(255, 230, 0, 0.3);
            padding: 8px; border-radius: 8px; color: #ffe600; font-weight: bold; font-size: 14px; margin-bottom: 15px;
        }

        .btn-play {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #00f0ff, #0077ff);
            border: none; border-radius: 10px; color: #fff; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: filter 0.2s;
        }
        .btn-play:hover { filter: brightness(1.2); }

        #hud {
            position: fixed; top: 20px; left: 20px; z-index: 10;
            background: rgba(5, 5, 15, 0.85); border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 20px; border-radius: 12px; backdrop-filter: blur(10px);
            display: none; gap: 20px; align-items: center; color: #fff;
        }
        .hud-item span { color: #00f0ff; font-weight: 700; }

        #leaderboard {
            position: fixed; top: 20px; right: 20px; z-index: 10;
            background: rgba(5, 5, 15, 0.85); border: 1px solid rgba(255,255,255,0.1);
            padding: 15px; border-radius: 12px; width: 220px; backdrop-filter: blur(10px);
            display: none; color: #fff; font-size: 13px;
        }
        #leaderboard h3 { font-size: 14px; color: #00f0ff; margin-bottom: 8px; text-align: center; letter-spacing: 1px; }
        .lb-row { display: flex; justify-content: space-between; margin-bottom: 5px; opacity: 0.85; }
    </style>
</head>
<body>

    <div id="menu-overlay">
        <div class="menu-card">
            <h1>NEON SNAKE</h1>
            <div class="coin-display">🪙 Moedas: <span id="coin-count">0</span></div>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('play')">Jogar</button>
                <button class="tab-btn" onclick="switchTab('shop')">Loja de Skins</button>
            </div>

            <div id="tab-play" class="tab-content active">
                <input type="text" id="nickname-input" class="menu-input" placeholder="Digite seu Nickname" maxlength="15" value="Player">
                <button class="btn-play" id="play-btn">JOGAR AGORA</button>
            </div>

            <div id="tab-shop" class="tab-content">
                <div class="skin-grid" id="skin-grid"></div>
                <p style="font-size: 11px; color: #aaa;">Clique para equipar ou comprar skins!</p>
            </div>
        </div>
    </div>

    <div id="gameover-overlay">
        <div class="menu-card">
            <h1 style="color: #ff0055;">VOCÊ MORREU!</h1>
            <p id="final-score" style="color: #fff; margin-bottom: 5px; font-size: 15px;">Comprimento final: 35</p>
            <p id="earned-coins" style="color: #ffe600; margin-bottom: 20px; font-size: 14px; font-weight: bold;">+0 Moedas ganhas</p>
            <button class="btn-play" id="respawn-btn">JOGAR NOVAMENTE</button>
        </div>
    </div>

    <div id="hud">
        <div class="hud-item">STATUS: <span id="net-status" style="color: #fbbf24;">Conectando...</span></div>
        <div style="width: 1px; height: 15px; background: rgba(255,255,255,0.1);"></div>
        <div class="hud-item">COMPRIMENTO: <span id="score-val">35</span></div>
    </div>

    <div id="leaderboard">
        <h3>PLACAR GLOBAL</h3>
        <div id="lb-list"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score-val");
        const statusEl = document.getElementById("net-status");
        const menuOverlay = document.getElementById("menu-overlay");
        const gameoverOverlay = document.getElementById("gameover-overlay");
        const hudEl = document.getElementById("hud");
        const lbEl = document.getElementById("leaderboard");
        const lbList = document.getElementById("lb-list");
        const playBtn = document.getElementById("play-btn");
        const respawnBtn = document.getElementById("respawn-btn");
        const nickInput = document.getElementById("nickname-input");
        const finalScoreEl = document.getElementById("final-score");
        const earnedCoinsEl = document.getElementById("earned-coins");
        const coinCountEl = document.getElementById("coin-count");

        let playerCoins = parseInt(localStorage.getItem('snake_coins') || '100');
        let unlockedSkins = JSON.parse(localStorage.getItem('snake_unlocked') || '["#00f0ff"]');
        let selectedColor = localStorage.getItem('snake_selected') || '#00f0ff';
        
        const skinsList = [
            { id: '#00f0ff', name: 'Cyan Neon', price: 0 },
            { id: '#ff0055', name: 'Pink Cyber', price: 0 },
            { id: '#ffe600', name: 'Gold King', price: 50 },
            { id: '#a855f7', name: 'Purple Void', price: 50 },
            { id: '#00ff66', name: 'Toxic Matrix', price: 100 },
            { id: '#ff4400', name: 'Magma Fire', price: 150 },
            { id: '#cc00ff', name: 'Wizard Magic', price: 200 },
            { id: '#ffffff', name: 'Ghost White', price: 250 },
            { id: '#ff0000', name: 'Bloodline', price: 300 }
        ];

        function updateShopUI() {
            coinCountEl.innerText = playerCoins;
            localStorage.setItem('snake_coins', playerCoins);
            localStorage.setItem('snake_unlocked', JSON.stringify(unlockedSkins));
            localStorage.setItem('snake_selected', selectedColor);

            const grid = document.getElementById('skin-grid');
            grid.innerHTML = '';
            
            skinsList.forEach(skin => {
                let isUnlocked = unlockedSkins.includes(skin.id);
                let isSelected = selectedColor === skin.id;

                let div = document.createElement('div');
                div.className = `skin-item ${isSelected ? 'selected' : ''}`;
                div.innerHTML = `
                    <div class="skin-preview" style="background: ${skin.id};"></div>
                    <div class="skin-name">${skin.name}</div>
                    <div class="skin-price">${isUnlocked ? (isSelected ? 'Equipado' : 'Desbloqueado') : '🪙 ' + skin.price}</div>
                `;
                div.onclick = () => selectOrBuySkin(skin);
                grid.appendChild(div);
            });
        }

        function selectOrBuySkin(skin) {
            if (unlockedSkins.includes(skin.id)) {
                selectedColor = skin.id;
            } else if (playerCoins >= skin.price) {
                playerCoins -= skin.price;
                unlockedSkins.push(skin.id);
                selectedColor = skin.id;
            } else {
                alert("Moedas insuficientes! Jogue mais partidas para farmar.");
            }
            updateShopUI();
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if (tab === 'play') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-play').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-shop').classList.add('active');
            }
        }

        updateShopUI();

        let playerName = "Player";
        let gameStarted = false;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Conectando dinamicamente ao host atual (funciona local e no Render)
        const socket = io();

        socket.on("connect", () => {
            statusEl.innerText = "Online";
            statusEl.style.color = "#34d399";
        });

        const MAP_SIZE = 6000;
        let snake = {
            x: MAP_SIZE / 2, y: MAP_SIZE / 2,
            angle: 0, speed: 4, radius: 14, body: []
        };

        function resetSnake() {
            snake.x = Math.random() * 4000 + 1000;
            snake.y = Math.random() * 4000 + 1000;
            snake.body = [];
            for (let i = 0; i < 35; i++) {
                snake.body.push({ x: snake.x, y: snake.y + (i * 4) });
            }
        }
        resetSnake();

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let serverData = { players: {}, bots: {}, foods: [] };

        window.addEventListener("mousemove", (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function startGame() {
            playerName = nickInput.value.trim() || "Player";
            menuOverlay.style.display = 'none';
            gameoverOverlay.style.display = 'none';
            hudEl.style.display = 'flex';
            lbEl.style.display = 'block';
            resetSnake();
            gameStarted = true;
            socket.emit('player_join', { x: snake.x, y: snake.y, body: snake.body, color: selectedColor, name: playerName });
        }

        playBtn.addEventListener('click', startGame);
        respawnBtn.addEventListener('click', startGame);

        socket.on('player_died', (data) => {
            gameStarted = false;
            hudEl.style.display = 'none';
            lbEl.style.display = 'none';
            
            let earned = Math.floor(data.score / 5);
            playerCoins += earned;
            updateShopUI();

            finalScoreEl.innerText = `Comprimento final: ${data.score}`;
            earnedCoinsEl.innerText = `+${earned} Moedas ganhas na partida!`;
            gameoverOverlay.style.display = 'flex';
        });

        socket.on('server_update', (data) => {
            serverData = data;
            updateLeaderboard();
        });

        function updateLeaderboard() {
            let allEntities = [];
            for (let id in serverData.players) {
                let p = serverData.players[id];
                allEntities.push({ name: p.name || 'Player', score: p.body ? p.body.length : 35 });
            }
            for (let id in serverData.bots) {
                let b = serverData.bots[id];
                allEntities.push({ name: b.name, score: b.body ? b.body.length : 35 });
            }

            allEntities.sort((a, b) => b.score - a.score);
            let top5 = allEntities.slice(0, 5);

            lbList.innerHTML = '';
            top5.forEach((item, index) => {
                lbList.innerHTML += `<div class="lb-row"><span>${index + 1}. ${item.name}</span><span>${item.score}</span></div>`;
            });
        }

        function update() {
            if (!gameStarted) return;

            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            let gp = gamepads[0];
            let hasControllerInput = false;

            if (gp && (Math.abs(gp.axes[0]) > 0.1 || Math.abs(gp.axes[1]) > 0.1)) {
                snake.angle = Math.atan2(gp.axes[1], gp.axes[0]);
                hasControllerInput = true;
            }

            if (!hasControllerInput) {
                const worldMouseX = mouseX - canvas.width / 2 + snake.x;
                const worldMouseY = mouseY - canvas.height / 2 + snake.y;
                let targetAngle = Math.atan2(worldMouseY - snake.y, worldMouseX - snake.x);
                let diff = targetAngle - snake.angle;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                snake.angle += diff * 0.15;
            }

            snake.x += Math.cos(snake.angle) * snake.speed;
            snake.y += Math.sin(snake.angle) * snake.speed;

            let targetX = snake.x;
            let targetY = snake.y;
            for (let i = 0; i < snake.body.length; i++) {
                let part = snake.body[i];
                let dx = targetX - part.x;
                let dy = targetY - part.y;
                let dist = Math.hypot(dx, dy);

                if (dist > 12) {
                    let ang = Math.atan2(dy, dx);
                    part.x = targetX - Math.cos(ang) * 12;
                    part.y = targetY - Math.sin(ang) * 12;
                }
                targetX = part.x;
                targetY = part.y;
            }

            socket.emit('player_sync', {
                x: snake.x, y: snake.y, angle: snake.angle,
                body: snake.body, name: playerName, color: selectedColor
            });
        }

        function draw() {
            ctx.fillStyle = "#050510";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!gameStarted) return;

            ctx.save();
            ctx.translate(canvas.width / 2 - snake.x, canvas.height / 2 - snake.y);

            ctx.strokeStyle = "#0d0d24";
            ctx.lineWidth = 1.5;
            for (let x = 0; x <= MAP_SIZE; x += 200) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
            }
            for (let y = 0; y <= MAP_SIZE; y += 200) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, y); ctx.stroke();
            }

            ctx.strokeStyle = "#ff0055";
            ctx.lineWidth = 6;
            ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

            if (serverData.foods) {
                for (let f of serverData.foods) {
                    ctx.fillStyle = f.color;
                    ctx.beginPath(); ctx.arc(f.x, f.y, 4, 0, Math.PI * 2); ctx.fill();
                }
            }

            for (let id in serverData.bots) {
                let b = serverData.bots[id];
                if (b && b.body) {
                    ctx.fillStyle = b.color;
                    for (let part of b.body) {
                        ctx.beginPath(); ctx.arc(part.x, part.y, 13, 0, Math.PI * 2); ctx.fill();
                    }
                    ctx.fillStyle = "#ffffff";
                    ctx.font = "12px system-ui";
                    ctx.textAlign = "center";
                    ctx.fillText(b.name, b.x, b.y - 22);
                }
            }

            for (let id in serverData.players) {
                if (id === socket.id) continue;
                let p = serverData.players[id];
                if (p && p.body) {
                    ctx.fillStyle = p.color || '#ff0055';
                    for (let part of p.body) {
                        ctx.beginPath(); ctx.arc(part.x, part.y, 13, 0, Math.PI * 2); ctx.fill();
                    }
                    if (p.name) {
                        ctx.fillStyle = "#ffffff";
                        ctx.font = "12px system-ui";
                        ctx.textAlign = "center";
                        ctx.fillText(p.name, p.x, p.y - 22);
                    }
                }
            }

            for (let i = snake.body.length - 1; i >= 0; i--) {
                let part = snake.body[i];
                let radius = Math.max(8, snake.radius - (i * 0.05));
                ctx.fillStyle = selectedColor;
                ctx.beginPath(); ctx.arc(part.x, part.y, radius, 0, Math.PI * 2); ctx.fill();
            }

            ctx.fillStyle = selectedColor;
            ctx.beginPath(); ctx.arc(snake.x, snake.y, snake.radius + 2, 0, Math.PI * 2); ctx.fill();

            let eyeOffset = 7;
            let e1x = snake.x + Math.cos(snake.angle - 0.55) * eyeOffset;
            let e1y = snake.y + Math.sin(snake.angle - 0.55) * eyeOffset;
            let e2x = snake.x + Math.cos(snake.angle + 0.55) * eyeOffset;
            let e2y = snake.y + Math.sin(snake.angle + 0.55) * eyeOffset;

            ctx.fillStyle = "#ffffff";
            ctx.beginPath(); ctx.arc(e1x, e1y, 4, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(e2x, e2y, 4, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = "#020208";
            ctx.beginPath(); ctx.arc(e1x + Math.cos(snake.angle)*1.5, e1y + Math.sin(snake.angle)*1.5, 1.8, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(e2x + Math.cos(snake.angle)*1.5, e2y + Math.sin(snake.angle)*1.5, 1.8, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 13px system-ui";
            ctx.textAlign = "center";
            ctx.fillText(playerName, snake.x, snake.y - 25);

            ctx.restore();
            scoreEl.innerText = snake.body.length;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake Arena - Mundo Infinito & PvP (Cobra.io Style)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Socket.io -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');
        body { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-2">

    <div class="max-w-5xl w-full bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-2xl p-5 shadow-2xl flex flex-col items-center">
        
        <!-- Header -->
        <div class="flex justify-between w-full items-center mb-3 border-b border-slate-800 pb-2">
            <div>
                <h1 class="text-xl font-extrabold tracking-wider text-cyan-400">NEON SNAKE PVP (COBRA.IO)</h1>
                <p class="text-xs text-slate-400">Colete as orbes de massa espalhadas pelo mapa para crescer!</p>
            </div>
            <div class="flex gap-4">
                <div class="bg-slate-800 px-3 py-1 rounded-xl border border-slate-700 text-xs font-bold text-amber-400 flex items-center gap-1">
                    🪙 MOEDAS: <span id="moedas" class="text-white text-sm">0</span>
                </div>
                <div class="bg-slate-800 px-3 py-1 rounded-xl border border-slate-700 text-xs font-bold text-cyan-400 flex items-center gap-1">
                    TAMANHO: <span id="tamanho" class="text-white text-sm">5</span>
                </div>
            </div>
        </div>

        <!-- Área Central -->
        <div class="flex flex-col md:flex-row gap-4 w-full items-center justify-center">
            
            <!-- Canvas -->
            <div class="relative rounded-xl overflow-hidden border-2 border-cyan-500/50 shadow-[0_0_35px_rgba(6,182,212,0.25)] bg-slate-950">
                <canvas id="gameCanvas" width="680" height="400" class="block"></canvas>
            </div>

            <!-- Loja de Skins -->
            <div class="w-full md:w-64 bg-slate-950/60 border border-slate-800 rounded-xl p-4 flex flex-col gap-3">
                <h2 class="text-sm font-bold text-fuchsia-400 uppercase tracking-wider border-b border-slate-800 pb-1">Loja de Skins</h2>
                <div class="flex flex-col gap-2 max-h-[340px] overflow-y-auto pr-1">
                    <button onclick="mudarSkin('#06b6d4', 0)" class="w-full py-2 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 border border-cyan-500/40 text-xs font-bold text-cyan-400 flex justify-between items-center transition">
                        <span>Neon Cyan</span><span class="text-[10px] bg-cyan-950 px-2 py-0.5 rounded text-cyan-300">Grátis</span>
                    </button>
                    <button onclick="mudarSkin('#eab308', 5)" class="w-full py-2 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 border border-amber-500/40 text-xs font-bold text-amber-400 flex justify-between items-center transition">
                        <span>Gold Cyber</span><span class="text-[10px] bg-amber-950 px-2 py-0.5 rounded text-amber-300">5 Moedas</span>
                    </button>
                    <button onclick="mudarSkin('#ec4899', 10)" class="w-full py-2 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 border border-pink-500/40 text-xs font-bold text-pink-400 flex justify-between items-center transition">
                        <span>Laser Pink</span><span class="text-[10px] bg-pink-950 px-2 py-0.5 rounded text-pink-300">10 Moedas</span>
                    </button>
                    <button onclick="mudarSkin('#22c55e', 15)" class="w-full py-2 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 border border-green-500/40 text-xs font-bold text-green-400 flex justify-between items-center transition">
                        <span>Matrix Green</span><span class="text-[10px] bg-green-950 px-2 py-0.5 rounded text-green-300">15 Moedas</span>
                    </button>
                    <button onclick="mudarSkin('#8b5cf6', 20)" class="w-full py-2 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 border border-purple-500/40 text-xs font-bold text-purple-400 flex justify-between items-center transition">
                        <span>Void Purple</span><span class="text-[10px] bg-purple-950 px-2 py-0.5 rounded text-purple-300">20 Moedas</span>
                    </button>
                    <button onclick="mudarSkin('#ef4444', 30)" class="w-full py-2 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 border border-red-500/40 text-xs font-bold text-red-400 flex justify-between items-center transition">
                        <span>Blood Ruby</span><span class="text-[10px] bg-red-950 px-2 py-0.5 rounded text-red-300">30 Moedas</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Rodapé -->
        <div class="flex justify-between w-full mt-3 text-xs text-slate-400 px-1">
            <span>🕹️ Controles: Teclado (WASD / Setas) ou Controle Xbox (Analógico / D-Pad)</span>
            <span class="text-emerald-400 font-semibold">⚡ Servidor Online Ativo</span>
        </div>
    </div>

    <!-- Lógica Atualizada (Orbes Estilo Cobra.io) -->
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const moedasEl = document.getElementById("moedas");
        const tamanhoEl = document.getElementById("tamanho");

        const socket = io("https://neon-snake-xzlj.onrender.com", {
            transports: ['websocket', 'polling']
        });
        
        const GRID_SIZE = 20;
        const MAP_WIDTH = 2500;
        const MAP_HEIGHT = 2500;

        let snake = [
            { x: 1250, y: 1250 },
            { x: 1230, y: 1250 },
            { x: 1210, y: 1250 },
            { x: 1190, y: 1250 },
            { x: 1170, y: 1250 }
        ];
        
        let dx = GRID_SIZE;
        let dy = 0;
        let proximaDirecao = { dx: GRID_SIZE, dy: 0 };
        let controleNeutro = true;

        let moedasCount = 0;
        let minhaCor = "#06b6d4";
        let outrosJogadores = {};

        // Geração de centenas de orbes de massa espalhadas pelo mapa (Estilo Slither/Cobra.io)
        let orbesMassa = [];
        const TOTAL_ORBES = 300;
        const coresOrbes = ["#f43f5e", "#eab308", "#06b6d4", "#a855f7", "#22c55e", "#ec4899"];

        function gerarOrbesIniciais() {
            for (let i = 0; i < TOTAL_ORBES; i++) {
                orbesMassa.push({
                    x: Math.floor(Math.random() * (MAP_WIDTH / GRID_SIZE)) * GRID_SIZE,
                    y: Math.floor(Math.random() * (MAP_HEIGHT / GRID_SIZE)) * GRID_SIZE,
                    cor: coresOrbes[Math.floor(Math.random() * coresOrbes.length)]
                });
            }
        }
        gerarOrbesIniciais();

        function mudarSkin(corHex, custo) {
            if (moedasCount >= custo) {
                moedasCount -= custo;
                minhaCor = corHex;
                moedasEl.innerText = moedasCount;
            } else {
                alert("Moedas insuficientes!");
            }
        }

        function mudarDirecao(novoDx, novoDy) {
            if (novoDx !== -dx || novoDy !== -dy) {
                proximaDirecao = { dx: novoDx, dy: novoDy };
            }
        }

        // Teclado
        window.addEventListener("keydown", (e) => {
            const key = e.key;
            if (key === "ArrowUp" || key === "w" || key === "W") mudarDirecao(0, -GRID_SIZE);
            if (key === "ArrowDown" || key === "s" || key === "S") mudarDirecao(0, GRID_SIZE);
            if (key === "ArrowLeft" || key === "a" || key === "A") mudarDirecao(-GRID_SIZE, 0);
            if (key === "ArrowRight" || key === "d" || key === "D") mudarDirecao(GRID_SIZE, 0);
        });

        // Controle Xbox
        function lerControleXbox() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            if (!gamepads[0]) return;
            const gp = gamepads[0];
            
            const eixoX = gp.axes[0];
            const eixoY = gp.axes[1];
            const deadzone = 0.5;

            if (Math.abs(eixoX) < deadzone && Math.abs(eixoY) < deadzone) {
                controleNeutro = true;
            }

            if (controleNeutro && (Math.abs(eixoX) > deadzone || Math.abs(eixoY) > deadzone)) {
                if (Math.abs(eixoX) > Math.abs(eixoY)) {
                    if (eixoX > 0) mudarDirecao(GRID_SIZE, 0);
                    else mudarDirecao(-GRID_SIZE, 0);
                } else {
                    if (eixoY > 0) mudarDirecao(0, GRID_SIZE);
                    else mudarDirecao(0, -GRID_SIZE);
                }
                controleNeutro = false;
            }

            if (gp.buttons[12] && gp.buttons[12].pressed) mudarDirecao(0, -GRID_SIZE);
            if (gp.buttons[13] && gp.buttons[13].pressed) mudarDirecao(0, GRID_SIZE);
            if (gp.buttons[14] && gp.buttons[14].pressed) mudarDirecao(-GRID_SIZE, 0);
            if (gp.buttons[15] && gp.buttons[15].pressed) mudarDirecao(GRID_SIZE, 0);
        }

        socket.on("atualizar_arena", (dados) => {
            outrosJogadores = dados;
        });

        function atualizar() {
            lerControleXbox();

            dx = proximaDirecao.dx;
            dy = proximaDirecao.dy;

            const cabeca = { x: snake[0].x + dx, y: snake[0].y + dy };

            if (cabeca.x < 0) cabeca.x = MAP_WIDTH - GRID_SIZE;
            if (cabeca.x >= MAP_WIDTH) cabeca.x = 0;
            if (cabeca.y < 0) cabeca.y = MAP_HEIGHT - GRID_SIZE;
            if (cabeca.y >= MAP_HEIGHT) cabeca.y = 0;

            snake.unshift(cabeca);

            // Verificar colisão com as várias orbes de massa espalhadas
            let comeuOrbe = false;
            for (let i = orbesMassa.length - 1; i >= 0; i--) {
                let o = orbesMassa[i];
                if (Math.abs(cabeca.x - o.x) < GRID_SIZE && Math.abs(cabeca.y - o.y) < GRID_SIZE) {
                    comeuOrbe = true;
                    moedasCount += 1;
                    moedasEl.innerText = moedasCount;

                    // Reposiciona a orbe comida em outro lugar aleatório do mapa (Mantém o fluxo constante)
                    orbesMassa[i].x = Math.floor(Math.random() * (MAP_WIDTH / GRID_SIZE)) * GRID_SIZE;
                    orbesMassa[i].y = Math.floor(Math.random() * (MAP_HEIGHT / GRID_SIZE)) * GRID_SIZE;
                    orbesMassa[i].cor = coresOrbes[Math.floor(Math.random() * coresOrbes.length)];
                    break; // Come uma por vez por frame
                }
            }

            if (!comeuOrbe) {
                snake.pop(); // Mantém o tamanho se não comeu
            }

            tamanhoEl.innerText = snake.length;

            socket.emit("player_sync", { x: cabeca.x, y: cabeca.y, corpo: snake, cor: minhaCor });
        }

        function desenhar() {
            let cabeca = snake[0];
            let camX = cabeca.x - canvas.width / 2;
            let camY = cabeca.y - canvas.height / 2;

            ctx.fillStyle = "#020617";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-camX, -camY);

            // Grade do Mundo
            ctx.strokeStyle = "#0f172a";
            ctx.lineWidth = 1;
            for (let i = 0; i <= MAP_WIDTH; i += 80) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, MAP_HEIGHT); ctx.stroke();
            }
            for (let j = 0; j <= MAP_HEIGHT; j += 80) {
                ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(MAP_WIDTH, j); ctx.stroke();
            }

            // Bordas
            ctx.strokeStyle = "#ef4444";
            ctx.lineWidth = 4;
            ctx.strokeRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

            // Desenhar todas as Orbes de Massa (Estilo Cobra.io)
            for (let o of orbesMassa) {
                ctx.shadowBlur = 12;
                ctx.shadowColor = o.cor;
                ctx.fillStyle = o.cor;
                ctx.beginPath();
                ctx.arc(o.x + GRID_SIZE/2, o.y + GRID_SIZE/2, 6, 0, Math.PI * 2);
                ctx.fill();
            }

            // Desenhar Minha Cobra
            ctx.shadowBlur = 15;
            ctx.shadowColor = minhaCor;
            ctx.fillStyle = minhaCor;
            for (let parte of snake) {
                ctx.fillRect(parte.x + 1, parte.y + 1, GRID_SIZE - 2, GRID_SIZE - 2);
            }

            // Desenhar Outros Jogadores
            for (let id in outrosJogadores) {
                let p = outrosJogadores[id];
                let corOutro = p.cor || "#f43f5e";
                ctx.shadowColor = corOutro;
                ctx.fillStyle = corOutro;
                if (p.corpo) {
                    for (let parte of p.corpo) {
                        ctx.fillRect(parte.x + 1, parte.y + 1, GRID_SIZE - 2, GRID_SIZE - 2);
                    }
                }
            }

            ctx.restore();
        }

        let ultimoTempo = 0;
        const velocidadeJogo = 100;

        function loop(tempoAtual) {
            if (!ultimoTempo) ultimoTempo = tempoAtual;
            let delta = tempoAtual - ultimoTempo;

            if (delta > velocidadeJogo) {
                atualizar();
                ultimoTempo = tempoAtual;
            }

            desenhar();
            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slither Open-Source Client</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { background: #0b0b16; color: #fff; margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        canvas { background: #05050a; box-shadow: 0 0 50px rgba(0,0,0,0.8); border: 2px solid #222244; cursor: crosshair; }
        #hud { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 8px; border: 1px solid #333; }
    </style>
</head>
<body>

    <div id="hud">Comprimento: <span id="score" style="color: #00ffcc; font-weight: bold;">30</span></div>
    <canvas id="gameCanvas" width="1000" height="700"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");

        // Conecta ao servidor (Substitua pelo seu link do Render se for rodar online)
        const socket = io("https://neon-snake-xzlj.onrender.com", {
            transports: ['websocket', 'polling']
        });

        const MAP_SIZE = 4000;

        let snake = {
            x: MAP_SIZE / 2,
            y: MAP_SIZE / 2,
            angulo: 0,
            velocidadeNormal: 3.2,
            velocidadeBoost: 6.0,
            raio: 12,
            cor: "#00ffcc",
            corpo: []
        };

        const DIST_ELOS = 12;
        for (let i = 0; i < 30; i++) {
            snake.corpo.push({ x: snake.x, y: snake.y + (i * 4) });
        }

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let acelerando = false;

        window.addEventListener("mousemove", (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        window.addEventListener("mousedown", () => acelerando = true);
        window.addEventListener("mouseup", () => acelerando = false);

        // Orbes locais de comida
        let orbes = [];
        for (let i = 0; i < 500; i++) {
            orbes.push({
                x: Math.random() * MAP_SIZE,
                y: Math.random() * MAP_SIZE,
                raio: 4,
                cor: ["#ff0055", "#ffcc00", "#00ffcc", "#9900ff"][Math.floor(Math.random() * 4)]
            });
        }

        let outrosJogadores = {};
        socket.on("atualizar_arena", (dados) => { outrosJogadores = dados; });

        function atualizar() {
            // Rotação suave em direção ao mouse
            const centroX = canvas.width / 2;
            const centroY = canvas.height / 2;
            let anguloAlvo = Math.atan2(mouseY - centroY, mouseX - centroX);

            let diff = anguloAlvo - snake.angulo;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            snake.angulo += diff * 0.15;

            let vel = acelerando && snake.corpo.length > 15 ? snake.velocidadeBoost : snake.velocidadeNormal;
            
            snake.x += Math.cos(snake.angulo) * vel;
            snake.y += Math.sin(snake.angulo) * vel;

            // Limites do mapa
            if (snake.x < 0) snake.x = 0;
            if (snake.x > MAP_SIZE) snake.x = MAP_SIZE;
            if (snake.y < 0) snake.y = 0;
            if (snake.y > MAP_SIZE) snake.y = MAP_SIZE;

            // Corpo elástico
            let alvoX = snake.x;
            let alvoY = snake.y;
            for (let i = 0; i < snake.corpo.length; i++) {
                let parte = snake.corpo[i];
                let dx = alvoX - parte.x;
                let dy = alvoY - parte.y;
                let dist = Math.hypot(dx, dy);

                if (dist > DIST_ELOS) {
                    let ang = Math.atan2(dy, dx);
                    parte.x = alvoX - Math.cos(ang) * DIST_ELOS;
                    parte.y = alvoY - Math.sin(ang) * DIST_ELOS;
                }
                alvoX = parte.x;
                alvoY = parte.y;
            }

            // Comer orbes
            for (let i = orbes.length - 1; i >= 0; i--) {
                let o = orbes[i];
                if (Math.hypot(snake.x - o.x, snake.y - o.y) < snake.raio + o.raio) {
                    orbes.splice(i, 1);
                    orbes.push({
                        x: Math.random() * MAP_SIZE,
                        y: Math.random() * MAP_SIZE,
                        raio: 4,
                        cor: ["#ff0055", "#ffcc00", "#00ffcc", "#9900ff"][Math.floor(Math.random() * 4)]
                    });
                    let ultimo = snake.corpo[snake.corpo.length - 1];
                    snake.corpo.push({ x: ultimo.x, y: ultimo.y });
                    scoreEl.innerText = snake.corpo.length;
                    break;
                }
            }

            socket.emit("player_sync", { x: snake.x, y: snake.y, corpo: snake.corpo, cor: snake.cor });
        }

        function desenhar() {
            ctx.fillStyle = "#05050a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            let camX = canvas.width / 2 - snake.x;
            let camY = canvas.height / 2 - snake.y;
            ctx.translate(camX, camY);

            // Grade
            ctx.strokeStyle = "#111122";
            ctx.lineWidth = 1;
            for (let x = 0; x <= MAP_SIZE; x += 100) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
            }
            for (let y = 0; y <= MAP_SIZE; y += 100) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, y); ctx.stroke();
            }

            // Orbes
            for (let o of orbes) {
                ctx.fillStyle = o.cor;
                ctx.beginPath(); ctx.arc(o.x, o.y, o.raio, 0, Math.PI * 2); ctx.fill();
            }

            // Outros jogadores
            for (let id in outrosJogadores) {
                if (id === socket.id) continue;
                let p = outrosJogadores[id];
                if (p.corpo) {
                    ctx.fillStyle = p.cor || "#ff0055";
                    for (let parte of p.corpo) {
                        ctx.beginPath(); ctx.arc(parte.x, parte.y, 11, 0, Math.PI * 2); ctx.fill();
                    }
                }
            }

            // Minha cobra
            for (let i = snake.corpo.length - 1; i >= 0; i--) {
                let parte = snake.corpo[i];
                ctx.fillStyle = snake.cor;
                ctx.beginPath(); ctx.arc(parte.x, parte.y, snake.raio, 0, Math.PI * 2); ctx.fill();
            }

            // Cabeça
            ctx.fillStyle = "#ffffff";
            ctx.beginPath(); ctx.arc(snake.x, snake.y, snake.raio + 1, 0, Math.PI * 2); ctx.fill();

            ctx.restore();
        }

        function loop() {
            atualizar();
            desenhar();
            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slither Game - Custom</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: sans-serif; }
        canvas { display: block; }
        
        /* Tela de Menu / Login */
        #menu {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            color: #fff;
            border: 2px solid #00f0ff;
            z-index: 10;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }
        #menu h2 { margin-bottom: 15px; color: #00f0ff; letter-spacing: 1px; }
        #menu input {
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            margin-bottom: 15px;
            width: 220px;
            text-align: center;
            outline: none;
        }
        #menu input:focus { border-color: #00f0ff; }
        #menu button {
            padding: 12px 25px;
            font-size: 16px;
            background: #00f0ff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: #000;
            transition: 0.2s;
        }
        #menu button:hover { background: #00bcd4; transform: scale(1.05); }

        /* Placar e HUD */
        #hud {
            position: absolute;
            top: 20px; left: 20px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            pointer-events: none;
            z-index: 5;
            display: none;
            text-shadow: 2px 2px 4px #000;
        }
    </style>
</head>
<body>

    <div id="hud">Comprimento: <span id="score">35</span></div>

    <!-- Menu Inicial -->
    <div id="menu">
        <h2>JOGO DA COBRINHA</h2>
        <input type="text" id="playerName" placeholder="Digite seu Nick" maxlength="15"><br>
        <button id="playBtn">JOGAR</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- Importação do Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const MAP_SIZE = 6000;

        let gameStarted = false;
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        let player = {
            name: '',
            x: MAP_SIZE / 2,
            y: MAP_SIZE / 2,
            angle: 0,
            speed: 4,
            color: '#00f0ff',
            body: []
        };

        let serverPlayers = {};
        let serverBots = {};
        let serverFoods = [];

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        document.getElementById('playBtn').addEventListener('click', () => {
            let nameInput = document.getElementById('playerName').value.trim();
            if (!nameInput) nameInput = "Jogador_" + Math.floor(Math.random() * 1000);
            
            player.name = nameInput;
            player.x = Math.random() * 2000 + 2000;
            player.y = Math.random() * 2000 + 2000;

            player.body = [];
            for (let i = 0; i < 35; i++) {
                player.body.push({ x: player.x, y: player.y + (i * 4) });
            }

            document.getElementById('menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            gameStarted = true;

            socket.emit('player_join', {
                name: player.name,
                x: player.x,
                y: player.y,
                body: player.body,
                color: player.color
            });
        });

        socket.on('server_update', (data) => {
            serverPlayers = data.players;
            serverBots = data.bots;
            serverFoods = data.foods;
        });

        socket.on('player_died', (data) => {
            let moedasGanhas = Math.floor(data.score / 5);
            alert('Você morreu! Pontuação final: ' + data.score + '\n+' + moedasGanhas + ' Moedas ganhas na partida!');
            location.reload();
        });

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameStarted) {
                let centerX = canvas.width / 2;
                let centerY = canvas.height / 2;
                let dx = mouseX - centerX;
                let dy = mouseY - centerY;
                player.angle = Math.atan2(dy, dx);

                player.x += Math.cos(player.angle) * player.speed;
                player.y += Math.sin(player.angle) * player.speed;

                // Trava limite na cliente
                player.x = Math.max(50, Math.min(MAP_SIZE - 50, player.x));
                player.y = Math.max(50, Math.min(MAP_SIZE - 50, player.y));

                let targetX = player.x;
                let targetY = player.y;
                for (let i = 0; i < player.body.length; i++) {
                    let part = player.body[i];
                    let pdx = targetX - part.x;
                    let pdy = targetY - part.y;
                    let pdist = Math.hypot(pdx, pdy);
                    if (pdist > 12) {
                        let pang = Math.atan2(pdy, pdx);
                        part.x = targetX - Math.cos(pang) * 12;
                        part.y = targetY - Math.sin(pang) * 12;
                    }
                    targetX = part.x;
                    targetY = part.y;
                }

                socket.emit('player_sync', {
                    x: player.x,
                    y: player.y,
                    angle: player.angle,
                    body: player.body,
                    color: player.color,
                    name: player.name
                });

                document.getElementById('score').innerText = player.body.length;

                // Renderização da câmera e do mundo de jogo
                let camX = player.x - canvas.width / 2;
                let camY = player.y - canvas.height / 2;

                ctx.save();
                ctx.translate(-camX, -camY);

                // Borda do mapa
                ctx.strokeStyle = '#ff0055';
                ctx.lineWidth = 10;
                ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

                // Comida
                if (serverFoods) {
                    serverFoods.forEach(f => {
                        ctx.fillStyle = f.color;
                        ctx.beginPath();
                        ctx.arc(f.x, f.y, 6, 0, Math.PI * 2);
                        ctx.fill();
                    });
                }

                function drawSnake(snake) {
                    if (!snake.body) return;
                    for (let i = snake.body.length - 1; i >= 0; i--) {
                        let part = snake.body[i];
                        ctx.fillStyle = snake.color || '#00f0ff';
                        ctx.beginPath();
                        ctx.arc(part.x, part.y, i === 0 ? 14 : 12, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#000';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                    if (snake.name && snake.body[0]) {
                        ctx.fillStyle = '#fff';
                        ctx.font = '14px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText(snake.name, snake.body[0].x, snake.body[0].y - 20);
                    }
                }

                for (let id in serverBots) {
                    drawSnake(serverBots[id]);
                }

                for (let id in serverPlayers) {
                    if (id !== socket.id) {
                        drawSnake(serverPlayers[id]);
                    }
                }

                drawSnake(player);
                ctx.restore();
            }

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>

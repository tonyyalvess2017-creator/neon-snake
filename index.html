<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slither Game - Custom</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: sans-serif; }
        canvas { display: block; }
        
        /* Tela de Menu / Login */
        #menu {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.9);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            color: #fff;
            border: 2px solid #00f0ff;
            z-index: 10;
        }
        #menu input {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            margin-bottom: 15px;
            width: 200px;
            text-align: center;
        }
        #menu button {
            padding: 10px 20px;
            font-size: 16px;
            background: #00f0ff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: #000;
        }
        #menu button:hover { background: #00bcd4; }

        /* Placar e HUD */
        #hud {
            position: absolute;
            top: 20px; left: 20px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            pointer-events: none;
            z-index: 5;
            display: none;
        }
    </style>
</head>
<body>

    <div id="hud">Comprimento: <span id="score">35</span></div>

    <!-- Menu Inicial -->
    <div id="menu">
        <h2>JOGO DA COBRINHA</h2>
        <input type="text" id="playerName" placeholder="Digite seu Nick" maxlength="15"><br>
        <button id="playBtn">JOGAR</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- Importação do Socket.IO fornecido pelo servidor Node.js -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const MAP_SIZE = 6000; // Mesmo tamanho de mapa configurado no server.js

        let gameStarted = false;
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        let player = {
            name: '',
            x: MAP_SIZE / 2,
            y: MAP_SIZE / 2,
            angle: 0,
            speed: 4,
            color: '#00f0ff',
            body: []
        };

        let serverPlayers = {};
        let serverBots = {};
        let serverFoods = [];

        // Captura o movimento do mouse para guiar a cobra
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        document.getElementById('playBtn').addEventListener('click', () => {
            let nameInput = document.getElementById('playerName').value.trim();
            if (!nameInput) nameInput = "Jogador_" + Math.floor(Math.random() * 1000);
            
            player.name = nameInput;
            player.x = Math.random() * 2000 + 2000;
            player.y = Math.random() * 2000 + 2000;

            // Cria corpo inicial com 35 partes
            player.body = [];
            for (let i = 0; i < 35; i++) {
                player.body.push({ x: player.x, y: player.y + (i * 4) });
            }

            document.getElementById('menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            gameStarted = true;

            socket.emit('player_join', {
                name: player.name,
                x: player.x,
                y: player.y,
                body: player.body,
                color: player.color
            });
        });

        // Ouve atualizações do servidor
        socket.on('server_update', (data) => {
            serverPlayers = data.players;
            serverBots = data.bots;
            serverFoods = data.foods;
        });

        // Caso o jogador morra
        socket.on('player_died', (data) => {
            alert('Você morreu! Sua pontuação final foi: ' + data.score);
            location.reload();
        });

        // Loop de Renderização e Física local do Cliente
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameStarted) {
                // Calcula o ângulo em direção ao mouse
                let centerX = canvas.width / 2;
                let centerY = canvas.height / 2;
                let dx = mouseX - centerX;
                let dy = mouseY - centerY;
                player.angle = Math.atan2(dy, dx);

                // Move a cabeça
                player.x += Math.cos(player.angle) * player.speed;
                player.y += Math.sin(player.angle) * player.speed;

                // TRAVA DE BORDA RIGIDA NO CLIENTE (Impede atravessar para fora)
                player.x = Math.max(50, Math.min(MAP_SIZE - 50, player.x));
                player.y = Math.max(50, Math.min(MAP_SIZE - 50, player.y));

                // Atualiza a física do corpo seguindo a cabeça
                let targetX = player.x;
                let targetY = player.y;
                for (let i = 0; i < player.body.length; i++) {
                    let part = player.body[i];
                    let pdx = targetX - part.x;
                    let pdy = targetY - part.y;
                    let pdist = Math.hypot(pdx, pdy);
                    if (pdist > 12) {
                        let pang = Math.atan2(pdy, pdx);
                        part.x = targetX - Math.cos(pang) * 12;
                        part.y = targetY - Math.sin(pang) * 12;
                    }
                    targetX = part.x;
                    targetY = part.y;
                }

                // Envia sincronização para o servidor
                socket.emit('player_sync', {
                    x: player.x,
                    y: player.y,
                    angle: player.angle,
                    body: player.body,
                    color: player.color,
                    name: player.name
                });

                document.getElementById('score').innerText = player.body.length;
            }

            // Câmera focada no jogador
            let camX = gameStarted ? player.x - canvas.width / 2 : 0;
            let camY = gameStarted ? player.y - canvas.height / 2 : 0;

            ctx.save();
            ctx.translate(-camX, -camY);

            // Desenha as bordas do mapa
            ctx.strokeStyle = '#ff0055';
            ctx.lineWidth = 10;
            ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

            // Desenha a Comida
            if (serverFoods) {
                serverFoods.forEach(f => {
                    ctx.fillStyle = f.color;
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, 6, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            // Função auxiliar para desenhar cobras (Jogadores e Bots)
            function drawSnake(snake) {
                if (!snake.body) return;
                for (let i = snake.body.length - 1; i >= 0; i--) {
                    let part = snake.body[i];
                    ctx.fillStyle = snake.color || '#00f0ff';
                    ctx.beginPath();
                    ctx.arc(part.x, part.y, i === 0 ? 14 : 12, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
                // Nome do jogador/bot
                if (snake.name && snake.body[0]) {
                    ctx.fillStyle = '#fff';
                    ctx.font = '14px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(snake.name, snake.body[0].x, snake.body[0].y - 20);
                }
            }

            // Desenha Bots
            for (let id in serverBots) {
                drawSnake(serverBots[id]);
            }

            // Desenha Outros Jogadores
            for (let id in serverPlayers) {
                if (id !== socket.id) {
                    drawSnake(serverPlayers[id]);
                }
            }

            // Desenha o Próprio Jogador
            if (gameStarted) {
                drawSnake(player);
            }

            ctx.restore();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
